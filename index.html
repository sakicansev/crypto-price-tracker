<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 30px;
        }
        h1 {
            color: #00d4ff;
        }
        table {
            border-collapse: collapse;
            width: 400px;
        }
        th {
            backgroun: #16213e;
            padding: 10px;
            border-bottom: 1px solid #333;
        }
        tr:hover {
            background: #16213e;
        }
    </style>
    <title>Crypto Price Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Crypto Price Tracker</h1>
    <p id="lastUpdated" style="color: #888;">Loading...</p>

    <table id="coinTable">
        <tr>
            <th>Coin</th>
            <th>Price</th>
            <th>24h Change</th>
        </tr>
    </table>
    <canvas id="priceChart" width="800" height="300" style="display:none; margin-top:30px;"></canvas>
    <script>
    function loadPrices() {
        fetch('/api/coins')
            .then(res => res.json())
            .then(coins => {
                const table = document.getElementById('coinTable');
                // clear old rows except header
                while (table.rows.length > 1) {
                    table.deleteRow(1);
                }
                for (let i = 0; i < coins.length; i++) {
                    const row = table.insertRow();
                    const arrow = coins[i].change_24h >= 0 ? '▲' : '▼';
                    const change = (coins[i].change_24h >= 0 ? '+' : '') + coins[i].change_24h.toFixed(2) + '%';
                    const color = coins[i].change_24h >= 0 ? '#00ff88' : '#ff4444';
                    row.innerHTML = '<td>' + coins[i].name + '</td>' +
                                    '<td>$' + coins[i].price_usd.toFixed(2) + '</td>' +
                                    '<td style="color:' + color + '">' + arrow + ' ' + change + '</td>';
                    row.style.cursor = 'pointer';
                    row.onclick = (function(id) {
                        return function() {
                            loadChart(id);
                        };                   
                    })(coins[i].coin_id);
                }
                document.getElementById('lastUpdated').innerText = 'Last updated: ' + new Date().toLocaleString();
            });
    }
    let chart = null;
    function loadChart(coinId) {
        fetch('/api/history/' + coinId)
        .then(res => res.json())
        .then(rows => {
            const labels = rows.map(r => new Date(r.timestamp).toLocaleTimeString());
            const data = rows.map(r => r.price_usd);

            document.getElementById('priceChart').style.display = 'block';

            if (chart) chart.destroy();

            chart = new Chart(document.getElementById('priceChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: coinId,
                        data: data,
                        borderColor: '#00d4ff',
                        backgroundColor: 'rgba(0,212,255,0.1)',
                        pointRadius: 0,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: false,
                    plugins:{ legend: {labels: {color: '#eee' } } },
                    scales: {
                        x: { ticks: { color: '#888', macTicksLimit: 10 } },
                        y: { ticks: { color: '#888' } }
                    }
                }
            })
        });
    }
    loadPrices();
    setInterval(loadPrices, 30000);
    </script>
</body>
</html>
